name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, lint, test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      # Build before test: @vocoder/mcp imports @vocoder/cli/lib from dist,
      # so its suites fail to load unless the CLI has been built.
      - name: Build
        run: pnpm run build

      - name: Assert CLI emitted JavaScript
        run: |
          for f in lib.mjs bin.mjs; do
            test -f "packages/cli/dist/$f" || { echo "missing packages/cli/dist/$f"; exit 1; }
          done

      - name: Test
        run: pnpm run test
